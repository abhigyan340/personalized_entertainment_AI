<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalized Entertainment AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span class="logo-mark">✦</span>
            PEA<span>I</span>
        </div>

        <nav>
            <a href="#discover">Discover</a>
            <a href="how-it-works.html">How It Works</a>
        </nav>

    </header>


    <main>

        <!-- HERO -->

        <section class="hero" id="discover">

            <div class="hero-content">

                <p class="eyebrow">
                    AI-POWERED MOVIE DISCOVERY
                </p>

                <h1>
                    Find your next
                    <span>obsession.</span>
                </h1>

                <p class="hero-description">
                    Tell us a movie you love.
                    Our recommendation engine will discover
                    movies that match its story, genres, themes,
                    cast and more.
                </p>


                <div class="search-wrap">

                    <div class="search-container">

                        <input
                            type="text"
                            id="movieInput"
                            placeholder="Enter a movie... "
                            autocomplete="off"
                        >

                        <button id="recommendButton">
                            <span>Recommend</span>
                            <span class="arrow">→</span>
                        </button>

                        <div id="searchResults" class="search-results"></div>

                    </div>

                </div>

                <div class="example-text">

                    Try:
                    <button class="example-movie">Avatar</button>
                    <button class="example-movie">The Dark Knight</button>
                    <button class="example-movie">The Hangover</button>
                </div>

            </div>

        </section>


    </main>


    <footer>

        <p>
            Personalized Entertainment AI
        </p>

        <p>
            Powered by Machine Learning
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
